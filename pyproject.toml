[build-system]
requires = ["maturin>=1.14.1"]
build-backend = "maturin"
[tool.maturin]
# Build artifacts with the specified Cargo profile
profile = "release"
module-name = "pc98rl._native"
[project]
name = "touhou-pc98-rl"
version = "0.1.0"
description = "CPU-first reinforcement-learning lab for Touhou PC-98 games"
requires-python = ">=3.12"
dependencies = [
  "gymnasium>=1.2,<2",
  "numpy>=2.5.1",
  "torch==2.13.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
#reinstall-package = ["touhou-pc98-rl"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
